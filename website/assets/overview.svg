 <radialGradient id="splat"><stop stop-color="#5389ba" stop-opacity=".62"/><stop offset=".6" stop-color="#5389ba" stop-opacity=".22"/><stop offset="1" stop-color="#5389ba" stop-opacity="0"/></radialGradient>
 <radialGradient id="warmSplat"><stop stop-color="#ca865a" stop-opacity=".66"/><stop offset="1" stop-color="#ca865a" stop-opacity="0"/></radialGradient>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc">
<title id="title">3dgs: panoramic observations to a browser-ready Gaussian scene</title>
<desc id="desc">Method illustration, not an experimental rendering. Dual-fisheye images and LiDAR feed compact data preparation. The native SH0 CUDA trainer initializes Gaussians from sparse points and sampled LiDAR, performs paired RGB and LiDAR updates, and prunes and densifies the scene. Main and environment Gaussians are exported as PLY-encoded PLY, compressed to SOG, and displayed in SuperSplat. Per-image corrections stay in the checkpoint.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#787c82" stroke-width="1.2"/></marker>
